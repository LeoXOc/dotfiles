########### DECODIFICACIÓN POR HARDWARE ###########
hwdec=nvdec             # API nativa de NVIDIA en Linux (más eficiente que auto)
hwdec-codecs=all        # Aplicar a todos los códecs compatibles

########### VIDEO ###########
vo=gpu
gpu-api=vulkan          # Vulkan funciona excelente con los drivers cerrados de Nvidia
# gpu-context se omitió intencionalmente para autodetección (Wayland/X11)
scale=bilinear          # Escalado ligero
cscale=bilinear
dscale=mitchell         # Escalado descendente de buena calidad
deband=no               # Desactivar debanding
deinterlace=no          # Desactivar desentrelazado (activar si es necesario)

# Sincronización
video-sync=display-resample
interpolation=no

########### AUDIO ###########
ao=pipewire             # Reemplaza WASAPI. PipeWire es el estándar en Arch actual.
audio-normalize-downmix=yes
audio-file-auto=all

# Idiomas preferidos
alang=jpn,jp,jap,Japanese,eng,en,enUS,en-US,spa,es,Spanish

########### SUBTÍTULOS ###########
slang=eng,en,enUS,en-US,es,spa,Spanish
sub-auto=fuzzy
sub-codepage=utf-8

########### STREAM / CACHE ###########
cache=yes               # Activar caché
cache-pause=no
cache-secs=20           # Aumentar buffer para streaming
demuxer-thread=yes
ytdl=yes                # Requiere tener 'yt-dlp' instalado en el sistema

########### GENERAL ###########
save-position-on-quit=yes
resume-playback=yes
watch-later-directory=~/.config/mpv/watch_later
screenshot-directory=~/Images/mpv/screenshots

########### OSC / OSD ###########
osc=no
osd-font=JetBrains Mono # Reemplaza Consolas (fuente de Windows) por una monospace de Linux
osd-font-size=33
osd-align-x=left
osd-align-y=top
osd-duration=5000
osd-msg1=${filename}... ${time-pos}/${duration}-(${percent-pos}%🎵)

########### VENTANA ###########
#tittle=MPV-Player
x11-present=yes
screen=1
screen-name=HDMI-0
geometry=1920x1080+0+0
keep-open=always
force-window=yes
force-window-position=yes
keepaspect-window=yes
image-display-duration=3
auto-window-resize=no
no-window-dragging
no-border
hidpi-window-scale=no
fs=yes
on-all-workspaces

# --- SALTAR IMÁGENES ---
# mpv no tiene un botón de "ignorar imágenes", pero podemos decirle que
# si detecta una, la muestre durante una fracción de segundo y salte a la siguiente.
image-display-duration=0.1

# --- MANEJO DE ARCHIVOS DAÑADOS ---
# Forzar a mpv a que pase al siguiente archivo en la playlist si algo sale mal
# en lugar de quedarse atascado o mantener el reproductor abierto.
keep-open=no

# Si el demuxer (el que lee el formato del archivo) se traba intentando
# leer un archivo corrupto, le decimos que no pierda tiempo y no lea por adelantado
# de forma agresiva en archivos locales problemáticos.
demuxer-readahead-secs=1

# Opcional: Reducir el spam de la terminal si un archivo está muy roto
msg-level=all=warn
