# =============================
# TERMINAL IDENTITY
# =============================

term xterm-kitty

# =============================
# FONT
# =============================

font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.0
disable_ligatures never

# =============================
# CURSOR
# =============================

cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor #cccccc
cursor_text_color #111111

# =============================
# SCROLLBACK
# =============================

scrollback_lines 5000
wheel_scroll_multiplier 3.0

# =============================
# PERFORMANCE
# =============================

repaint_delay 5
input_delay 2
sync_to_monitor yes

# =============================
# WINDOW
# =============================

remember_window_size yes
initial_window_width  1920
initial_window_height 1050
window_padding_width 4
draw_minimal_borders yes

# =============================
# COLORS
# =============================

foreground #dddddd
background #000000
background_opacity 0.45

selection_foreground #000000
selection_background #fffacd

# =============================
# COLOR TABLE
# =============================

color0 #000000
color8 #767676
color1 #cc0403
color9 #f2201f
color2  #19cb00
color10 #23fd00
color3  #cecb00
color11 #fffd00
color4  #0d73cc
color12 #1a8fff
color5  #cb1ed1
color13 #fd28ff
color6  #0dcdcd
color14 #14ffff
color7  #dddddd
color15 #ffffff

# =============================
# SHELL
# =============================

shell /bin/bash

# =============================
# SHELL INTEGRATION
# =============================

shell_integration enabled

# =============================
# CLIPBOARD
# =============================

copy_on_select yes
clipboard_control write-clipboard write-primary

# =============================
# TAB BAR
# =============================

tab_bar_edge bottom
tab_bar_style fade
tab_bar_align left

# =============================
# KEY MODIFIER
# =============================

kitty_mod ctrl+shift


